[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmoera"
version = "0.2.0"
description = "Local backtesting for dMoERA strategies: run every bot in the Crypto-Strategies corpus on your own machine with the exact validation engine, then grade and validate the result."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CacheCarti" }]
keywords = ["algorithmic-trading", "backtesting", "crypto", "binance", "trading-strategies", "quant", "overfitting", "deflated-sharpe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["numpy>=1.24"]

[project.scripts]
dmoera = "dmoera.cli:main"

[project.urls]
Homepage = "https://github.com/CacheCarti/dmoera-cli"
Repository = "https://github.com/CacheCarti/dmoera-cli"
Documentation = "https://github.com/CacheCarti/Crypto-Strategies"

[tool.setuptools.packages.find]
include = ["dmoera*", "domains*"]
